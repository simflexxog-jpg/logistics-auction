<div class="customer-portal-surface">
  <div class="portal-hero d-flex align-items-center justify-content-between gap-3 flex-wrap">
    <div>
      <div class="hero-badge mb-3">24/7 Support</div>
      <h4 class="mb-1">AI Logistics Support</h4>
      <p>Ask about routes, add-on eligibility, shipment planning, or bidding strategy anytime.</p>
    </div>
    <span class="badge bg-success-subtle text-success">Always on</span>
  </div>

  <div class="portal-panel">
    <div class="mb-3">
      <div class="small text-muted mb-2">Support chat</div>
      <div class="chat-box bg-white border rounded-3 p-3" style="min-height: 320px; max-height: 520px; overflow-y: auto;">
        <ng-container *ngFor="let msg of supportMessages()">
          <div [class]="msg.role === 'assistant' ? 'chat-message assistant' : 'chat-message user'">
            <div class="chat-role text-muted small mb-1">{{ msg.role === 'assistant' ? 'Support Bot' : auth.currentUser()?.name || 'You' }}</div>
            <div class="chat-text">{{ msg.text }}</div>
          </div>
        </ng-container>
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label fw-semibold">Ask support</label>
      <textarea class="form-control" rows="3" [(ngModel)]="supportInput" name="supportInput" placeholder="Ask about route optimization, add-ons, or shipment timing"></textarea>
      <div class="d-flex justify-content-between align-items-center mt-2">
        <div class="text-muted small">Powered by API-backed assistance.</div>
        <button class="btn btn-primary" [disabled]="aiLoading() || !supportInput().trim()" (click)="sendSupportMessage()">
          <span *ngIf="aiLoading()" class="spinner-border spinner-border-sm me-2"></span>
          Send
        </button>
      </div>
      <div *ngIf="error()" class="alert alert-danger mt-3 mb-0">{{ error() }}</div>
    </div>
  </div>
</div>
